<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenTopoX Preset Entry</title>
    <link rel="stylesheet" href="../../src/framework/topology.css" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #f6f8fb;
        color: #172033;
      }

      .app {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100%;
      }

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        border-bottom: 1px solid #d9e2ef;
        background: #ffffff;
      }

      .title {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
      }

      .tabs {
        display: flex;
        gap: 8px;
      }

      button {
        border: 1px solid #c8d4e4;
        border-radius: 6px;
        background: #ffffff;
        color: #172033;
        cursor: pointer;
        font: inherit;
        padding: 7px 10px;
      }

      button[aria-pressed="true"] {
        border-color: #2563eb;
        color: #1746a2;
      }

      #graph {
        width: 100%;
        min-height: 540px;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="bar">
        <h1 class="title">Preset Topology Entry</h1>
        <div class="tabs" aria-label="Preset type">
          <button type="button" data-type="standard" aria-pressed="true">Standard</button>
          <button type="button" data-type="flow" aria-pressed="false">Flow</button>
          <button type="button" data-type="spatial" aria-pressed="false">Spatial</button>
        </div>
      </header>
      <div id="graph"></div>
    </main>

    <script type="module">
      import {
        createTopologyGraph,
        registerNodeShape,
        registerTopologyShape,
      } from "../../src/framework/index.js";

      registerNodeShape("compact-service", {
        render(node, { escapeHtml }) {
          const title = escapeHtml(node.data?.title || node.id);
          const metric = escapeHtml(node.data?.metric?.value || "-");
          return `<strong>${title}</strong><span>${metric}</span>`;
        },
      });

      registerTopologyShape("node", "compat-service", {
        render(node, { escapeHtml }) {
          return `<strong>${escapeHtml(node.data?.title || node.id)}</strong>`;
        },
      });

      const container = document.querySelector("#graph");
      let topo = null;

      const data = {
        nodes: [
          { id: "plan", type: "compact-service", position: { x: 80, y: 120 }, data: { title: "Plan", status: "ok", metric: { label: "Steps", value: 4 } } },
          { id: "build", type: "compact-service", position: { x: 360, y: 80 }, data: { title: "Build", status: "ok", metric: { label: "Time", value: "2m" } } },
          { id: "verify", type: "compat-service", position: { x: 360, y: 240 }, data: { title: "Verify", status: "warn", metric: { label: "Cases", value: 18 } } },
          { id: "release", type: "compact-service", position: { x: 650, y: 160 }, data: { title: "Release", status: "ok", metric: { label: "Risk", value: "low" } } },
        ],
        edges: [
          { id: "plan-build", source: "plan", target: "build", label: "generates" },
          { id: "plan-verify", source: "plan", target: "verify", label: "checks" },
          { id: "build-release", source: "build", target: "release", label: "artifact" },
          { id: "verify-release", source: "verify", target: "release", label: "approval" },
        ],
      };

      async function renderPreset(type) {
        topo?.destroy();
        topo = createTopologyGraph({
          type,
          container,
          config: {
            theme: "neutral",
            grid: true,
            minimap: true,
            nodeDraggable: true,
          },
          layout: type === "spatial" ? { topoType: "preset" } : undefined,
        });
        await topo.getGraph().setData({ ...data, autoFit: true });
      }

      document.querySelectorAll("[data-type]").forEach((button) => {
        button.addEventListener("click", async () => {
          document.querySelectorAll("[data-type]").forEach((item) => {
            item.setAttribute("aria-pressed", String(item === button));
          });
          await renderPreset(button.dataset.type);
        });
      });

      await renderPreset("standard");
    </script>
  </body>
</html>
