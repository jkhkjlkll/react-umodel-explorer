<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenTopoX Cloud Resource Topology</title>
    <link rel="stylesheet" href="../../src/framework/topology.css" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #f5f7fb;
        color: #172033;
      }

      .app {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100%;
      }

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        border-bottom: 1px solid #d9e2ef;
        background: #ffffff;
      }

      .title {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
      }

      .meta {
        display: flex;
        gap: 10px;
        color: #526276;
        font-size: 13px;
      }

      #graph {
        width: 100%;
        min-height: 560px;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="bar">
        <h1 class="title">Cloud Resource Topology</h1>
        <div class="meta">
          <span id="connected"></span>
          <span id="pending"></span>
        </div>
      </header>
      <div id="graph"></div>
    </main>

    <script type="module">
      import {
        NewTopoGraph,
        buildCloudResourceTopology,
      } from "../../src/framework/index.js";

      const topology = buildCloudResourceTopology({
        connectedResources: [
          { id: "slb-main", name: "Public SLB", type: "slb", regionId: "cn-hangzhou", layer: 0, metric: { label: "QPS", value: "12.2k" } },
          { id: "ecs-api-a", name: "API ECS A", type: "ecs", regionId: "cn-hangzhou", layer: 1, metric: { label: "CPU", value: "42%" } },
          { id: "ecs-api-b", name: "API ECS B", type: "ecs", regionId: "cn-hangzhou", layer: 1, metric: { label: "CPU", value: "37%" } },
          { id: "rds-orders", name: "Orders RDS", type: "rds", regionId: "cn-hangzhou", layer: 2, metric: { label: "QPS", value: "860" } },
          { id: "redis-session", name: "Session Redis", type: "redis", regionId: "cn-hangzhou", layer: 2, metric: { label: "Hit", value: "98.9%" } },
        ],
        unconnectedResources: [
          { id: "oss-audit", name: "Audit OSS", type: "oss", regionId: "cn-hangzhou" },
          { id: "fc-worker", name: "Async FC", type: "fc", regionId: "cn-shanghai" },
        ],
        connections: [
          { source: "slb-main", target: "ecs-api-a", label: "balances", latency: "11 ms" },
          { source: "slb-main", target: "ecs-api-b", label: "balances", latency: "14 ms" },
          { source: "ecs-api-a", target: "rds-orders", label: "queries", latency: "22 ms" },
          { source: "ecs-api-b", target: "rds-orders", label: "queries", latency: "25 ms" },
          { source: "ecs-api-a", target: "redis-session", label: "cache", latency: "3 ms" },
          { source: "ecs-api-b", target: "redis-session", label: "cache", latency: "4 ms" },
        ],
      });

      const topo = new NewTopoGraph({
        container: document.querySelector("#graph"),
        config: {
          theme: "neutral",
          grid: true,
          minimap: true,
          performanceEdgeLabelLimit: 80,
        },
      });

      const graph = topo.getGraph();
      graph.setLayout({ topoType: "layer", rankDir: "LR", rankSep: 240, nodeSep: 70 });
      await graph.setData({ ...topology, autoFit: true });

      document.querySelector("#connected").textContent = `${topology.meta.connectedCount} connected`;
      document.querySelector("#pending").textContent = `${topology.meta.unconnectedCount} pending`;
    </script>
  </body>
</html>
